apiVersion: 1

contactPoints:
  - orgId: 1
    name: grafana-default-email
    receivers:
      - uid: grafana-default-email
        type: email
        settings:
          addresses: noop@localhost
  - orgId: 1
    name: responder-webhook
    receivers:
      - uid: responder-webhook-1
        type: webhook
        settings:
          url: $RESPONDER_WEBHOOK_URL
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $RESPONDER_WEBHOOK_SECRET
