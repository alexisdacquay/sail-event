name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FAKE_NOW: "2026-10-18T12:00:00+02:00"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Lint OpenAPI spec
        run: npx @redocly/cli lint ../openapi.yaml

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      HOST_PORT: "8000"
      SAIL_BASE_URL: http://localhost:8000
      SAIL_COMPOSE_MANAGED: "1"
      REGISTER_RATE_LIMIT_PER_HOUR: "1000"
      FAKE_NOW: "2026-10-18T12:00:00+02:00"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: docker compose up --build -d --wait
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: make test-integration
      - run: make test-e2e
      - name: Show Playwright failure context
        if: failure()
        run: |
          for f in e2e/test-results/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "===== $f"; cat "$f"
          done
          docker compose logs --tail 80 app
      - name: Tear down
        if: always()
        run: docker compose down -v
