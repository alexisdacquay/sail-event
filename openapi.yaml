openapi: 3.1.0
info:
  title: Sail-event API
  version: 0.1.0
  description: API contract for the Sail-event application.

servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /api/auth/register:
    post:
      operationId: register
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/login:
    post:
      operationId: login
      summary: Authenticate a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/criteria:
    get:
      operationId: getCriteria
      summary: Get the current user's search criteria
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criteria'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: saveCriteria
      summary: Replace the current user's search criteria
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCriteriaRequest'
      responses:
        '200':
          description: Criteria saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criteria'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/thresholds:
    get:
      operationId: getThresholds
      summary: Get the current user's score thresholds
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current thresholds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thresholds'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: saveThresholds
      summary: Replace the current user's score thresholds
      description: >-
        Saves the new thresholds and re-applies them to auto-decided events
        (events where decidedBy is "auto" or null). User decisions are untouched.
        The response includes the count of events whose status changed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Thresholds'
      responses:
        '200':
          description: Thresholds saved and re-applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdsSaveResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/search:
    post:
      operationId: runSearch
      summary: Trigger a search for the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Search completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/events:
    get:
      operationId: listEvents
      summary: List the current user's events
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventStatus'
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/events/{id}/decision:
    post:
      operationId: decideEvent
      summary: Accept, reject, or put an event back to review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/health:
    get:
      operationId: healthCheck
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                  commit:
                    type: string
                    description: Git commit running, empty outside Render

  /api/search/all:
    post:
      operationId: searchAll
      summary: Trigger search for all users (scheduler)
      security:
        - apiKeyAuth: []
      responses:
        '202':
          description: Users queued for background processing
          content:
            application/json:
              schema:
                type: object
                required:
                  - usersQueued
                  - usersSkipped
                properties:
                  usersQueued:
                    type: integer
                    description: Number of users enqueued for background runs
                  usersSkipped:
                    type: integer
                    description: Users skipped (still running or over the cap)
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/config:
    get:
      operationId: getConfig
      summary: Public configuration flags
      security: []
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'

  /api/calendar-url:
    get:
      operationId: getCalendarUrl
      summary: Get the authenticated user's calendar feed URL
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Calendar feed URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/calendar/rotate:
    post:
      operationId: rotateCalendarUrl
      summary: Rotate the authenticated user's ICS token and return the new feed URL
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New calendar feed URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/calendar/{ics_token}:
    get:
      operationId: getCalendarFeed
      summary: ICS calendar feed for a user
      security: []
      parameters:
        - name: ics_token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Calendar feed
          content:
            text/calendar:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    AuthResponse:
      type: object
      required:
        - token
        - username
      properties:
        token:
          type: string
        username:
          type: string

    Criteria:
      type: object
      required:
        - text
        - updatedAt
      properties:
        text:
          type: string
        updatedAt:
          type: string
        timeZone:
          type:
            - string
            - 'null'
          description: IANA time zone of the user

    Thresholds:
      type: object
      required:
        - lowerThreshold
        - upperThreshold
      properties:
        lowerThreshold:
          type: number
        upperThreshold:
          type: number

    ThresholdsSaveResult:
      type: object
      required:
        - lowerThreshold
        - upperThreshold
        - eventsMoved
      properties:
        lowerThreshold:
          type: number
        upperThreshold:
          type: number
        eventsMoved:
          type: integer
          description: Number of auto-decided events whose status changed

    SearchResult:
      type: object
      required:
        - runId
        - eventsFound
        - eventsNew
      properties:
        runId:
          type: string
        eventsFound:
          type: integer
        eventsNew:
          type: integer
        stageCounts:
          type:
            - object
            - 'null'
          description: Per-stage item counts from the run
        stoppedAtStage:
          type:
            - string
            - 'null'
          description: Stage where the run stopped early, if applicable
        error:
          type:
            - string
            - 'null'
          description: Run-level error message

    EventStatus:
      type: string
      enum:
        - new
        - accepted
        - rejected
        - queued

    Event:
      type: object
      required:
        - id
        - title
        - dateTime
        - place
        - link
        - description
        - score
        - scoreReason
        - status
      properties:
        id:
          type: string
        title:
          type: string
        dateTime:
          type: string
          description: >-
            ISO-8601 local with UTC offset when the zone is known
            (e.g. 2026-10-20T20:00:00+02:00), or YYYY-MM-DD for date-only events
        place:
          type: string
        link:
          type: string
        description:
          type: string
        startTz:
          type:
            - string
            - 'null'
          description: IANA time zone of the event start
        endTime:
          type:
            - string
            - 'null'
          description: >-
            End date-time in the same format as dateTime
            (ISO-8601 local with UTC offset, or YYYY-MM-DD)
        city:
          type: string
          description: City from extraction
        country:
          type: string
          description: ISO-3166-1 alpha-2 country code
        sourceUrl:
          type:
            - string
            - 'null'
          description: The page the event was extracted from
        band:
          type:
            - string
            - 'null'
          description: Human-readable score band (fits, mostly fits, open question, off topic, not a fit)
        score:
          type: number
        scoreReason:
          type: string
        status:
          $ref: '#/components/schemas/EventStatus'
        decidedBy:
          type:
            - string
            - 'null'
          enum:
            - auto
            - user
            - null
          description: Who triaged this event — auto (pipeline) or user (manual decision). Null for queued events.

    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          maxLength: 72
        registrationCode:
          type: string

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          maxLength: 72

    SaveCriteriaRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          maxLength: 2000
        timeZone:
          type: string
          description: IANA time zone from the browser

    DecisionRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - accepted
            - rejected
            - queued
          description: >-
            "accepted" or "rejected" for normal decisions;
            "queued" to undo a decision (put back to review)

    CalendarUrlResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string

    ConfigResponse:
      type: object
      required:
        - registrationCodeRequired
      properties:
        registrationCodeRequired:
          type: boolean

    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

  responses:
    BadRequest:
      description: Malformed request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict (duplicate username)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many failed login attempts
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate-limit window expires
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
