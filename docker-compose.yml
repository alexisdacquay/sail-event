services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sail
      POSTGRES_PASSWORD: sail
      POSTGRES_DB: sail_event
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sail"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://sail:sail@postgres:5432/sail_event"
      JWT_SECRET: "${JWT_SECRET:-}"
      SEARCH_ALL_API_KEY: "${SEARCH_ALL_API_KEY:-dev-api-key}"
      SEED_DEMO: "${SEED_DEMO:-1}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      REGISTER_RATE_LIMIT_PER_HOUR: "${REGISTER_RATE_LIMIT_PER_HOUR:-5}"
      FAKE_NOW: "${FAKE_NOW:-}"
    ports:
      - "${HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
