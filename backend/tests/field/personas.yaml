# Field-test personas: one cell of the matrix each. runner.py runs them in this order.
#
# Axes covered: language (en es pt de fr ja), place (city / region / none / ambiguous),
# time (day / weekend / month / none / past), specificity (word / sentence / paragraph /
# contradictory / exclusion), intent (concert, regatta, kids+access, meetup, non-event, injection),
# path (search only / criteria change). Add a cell when a user test finds something no cell covers.
#
# Fields: id (user is field_<id>), text, tz, lang (expected reason language), country (ISO-2 when a
# place is named, omit when not), exclude (words that must not appear in kept events),
# expect_kept (0 for non-events), then (second criteria text: the criteria-change path),
# want (tier 3 recall: real events verified on the venue's own site, as {title: <distinctive words
# from the title>, date: YYYY-MM-DD, source: <url>}; the battery reports found/want).

- id: lisbon_sat_en
  text: "live music, a food market or something outdoors in Lisbon on Saturday 24 October 2026"
  tz: Europe/Lisbon
  lang: en
  country: PT
