[project]
name = "backend"
version = "0.1.0"
description = "Sail-event backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "bcrypt==5.0.0",
    "fastapi==0.143.0",
    "icalendar==7.3.0",
    "pyjwt==2.15.1",
    "sqlalchemy==2.1.5",
    "uvicorn==0.34.3",
    "psycopg[binary]==3.3.6",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that hit the live compose stack over HTTP"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "httpx==0.28.1",
    "pyyaml==6.0.2",
]
