[project]
name = "backend"
version = "0.1.0"
description = "Sail-event backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "bcrypt==5.0.0",
    "fastapi==0.143.0",
    "icalendar==7.3.0",
    "pyjwt==2.15.1",
    "sqlalchemy==2.1.5",
    "uvicorn==0.34.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "httpx==0.28.1",
    "pyyaml==6.0.2",
]
