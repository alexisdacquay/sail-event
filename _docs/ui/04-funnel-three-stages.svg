<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="10">
  <title>Approved three-stage funnel: one continuous flow, pages read → events found → verdicts. Bars sit directly on the ribbons; no gaps between stages; a stage's main ribbon becomes the next bar.</title>
  <rect width="640" height="170" fill="#15181d"/>
  <g fill="#a7afbb">
    <rect x="10" y="20" width="16" height="100" fill="#4a5362"/>
    <text x="10" y="135" fill="#eef0f3" font-weight="500">20 pages read</text>
    <path d="M26 20 C120 20 120 10 200 10 L200 150 C120 150 120 120 26 120 Z" fill="#2b313b"/>
    <text x="34" y="66" fill="#eef0f3" font-weight="500">28 events</text>
    <text x="34" y="78">from 8 pages</text>
    <text x="34" y="108">12 pages: no events</text>

    <rect x="200" y="10" width="16" height="140" fill="#4a5362"/>
    <text x="200" y="165" fill="#eef0f3" font-weight="500">28 found</text>
    <path d="M216 10 C300 10 300 10 400 10 L400 125 C300 125 300 125 216 125 Z" fill="#2b313b"/>
    <path d="M216 125 C300 125 300 132 400 132 L400 150 C300 150 300 150 216 150 Z" fill="#6b7482" opacity=".5"/>
    <text x="224" y="60" fill="#eef0f3" font-weight="500">23 judged</text>
    <text x="224" y="142">5 no date · 0 past · 0 dup</text>

    <rect x="400" y="10" width="16" height="115" fill="#4a5362"/>
    <path d="M416 10 C500 10 500 6 580 6 L580 16 C500 16 500 20 416 20 Z" fill="#1D9E75" opacity=".6"/>
    <path d="M416 20 C500 20 500 22 580 22 L580 27 C500 27 500 25 416 25 Z" fill="#EF9F27" opacity=".7"/>
    <path d="M416 25 C500 25 500 33 580 33 L580 118 C500 118 500 125 416 125 Z" fill="#E24B4A" opacity=".35"/>
    <rect x="580" y="6" width="6" height="10" fill="#1D9E75"/>
    <rect x="580" y="22" width="6" height="5" fill="#EF9F27"/>
    <rect x="580" y="33" width="6" height="85" fill="#E24B4A"/>
    <text x="592" y="14" fill="#eef0f3" font-weight="500">2 in</text>
    <text x="592" y="28" fill="#eef0f3" font-weight="500">1 review</text>
    <text x="592" y="70" fill="#eef0f3" font-weight="500">20 out</text>
    <text x="592" y="82">16 date/place</text>
    <text x="592" y="93">4 topic</text>
  </g>
</svg>
