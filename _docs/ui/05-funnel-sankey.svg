<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="10">
  <title>Approved Sankey layout of a run (owner, 2026-10-22). One scale: 5 px per event; a ribbon keeps its thickness end to end. Three columns: found; judged + not judged; in calendar + to review + out. Nodes in a column are stacked with a fixed gap and centred on the column; the gaps bend the ribbons. Labels beside their own node, never inside a ribbon.</title>
  <rect width="640" height="200" fill="#f6f7f9"/>
  <g fill="#5b6472">
    <rect x="10" y="40" width="14" height="120" fill="#cfd4db"/>
    <text x="10" y="176" fill="#15181d" font-weight="500">24 found</text>
    <text x="10" y="187">from 8 of 20 pages read</text>
    <path d="M24 40 C140 40 140 20 260 20 L260 60 C140 60 140 80 24 80 Z" fill="#e3e6eb"/>
    <path d="M24 80 C140 80 140 88 260 88 L260 168 C140 168 140 160 24 160 Z" fill="#9aa3b0" opacity=".3"/>
    <rect x="260" y="20" width="14" height="40" fill="#cfd4db"/>
    <text x="280" y="33" fill="#15181d" font-weight="500">8 judged</text>
    <rect x="260" y="88" width="14" height="80" fill="#cfd4db"/>
    <text x="280" y="124" fill="#15181d" font-weight="500">16 not judged</text>
    <text x="280" y="135">5 no date · 9 duplicate · 2 errors</text>
    <path d="M274 20 C400 20 400 8 520 8 L520 18 C400 18 400 30 274 30 Z" fill="#1D9E75" opacity=".6"/>
    <path d="M274 30 C400 30 400 34 520 34 L520 39 C400 39 400 35 274 35 Z" fill="#EF9F27" opacity=".7"/>
    <path d="M274 35 C400 35 400 55 520 55 L520 80 C400 80 400 60 274 60 Z" fill="#E24B4A" opacity=".4"/>
    <rect x="520" y="8" width="6" height="10" fill="#1D9E75"/>
    <rect x="520" y="34" width="6" height="5" fill="#EF9F27"/>
    <rect x="520" y="55" width="6" height="25" fill="#E24B4A"/>
    <text x="532" y="16" fill="#15181d" font-weight="500">2 in calendar</text>
    <text x="532" y="40" fill="#15181d" font-weight="500">1 to review</text>
    <text x="532" y="66" fill="#15181d" font-weight="500">5 out</text>
    <text x="532" y="77">4 date or place · 1 topic</text>
  </g>
</svg>
