services:
  app:
    networks:
      - default
      - sail-observability
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      APP_ENV: "${APP_ENV:-dev}"
      APP_VERSION: "${APP_VERSION:-dev}"

networks:
  sail-observability:
    name: ${SAIL_OBS_NETWORK:-sail-observability}
    external: true
