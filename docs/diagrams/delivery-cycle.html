<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One work cycle of the agent team</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Sail-event process</p>
    <h1>One work cycle of the agent team</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 468" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delivery-cycle-title delivery-cycle-desc">
        <title id="delivery-cycle-title">One work cycle of the agent team</title>
        <desc id="delivery-cycle-desc">The owner picks an issue, PM grooms it, the engineer builds and opens a PR, and QA checks the PR commit; a fail goes back to the engineer unless the owner grants a waiver, and after a pass or waiver with green CI the owner authorizes a merge to main that deploys nothing, then names the commit for the manual prod promote.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- ===== Arrows (drawn first, behind nodes) ===== -->
        <!-- Build row -->
        <line x1="156" y1="114" x2="188" y2="114" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="316" y1="114" x2="348" y2="114" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="476" y1="114" x2="508" y2="114" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- QA FAIL: back to engineer, over the top -->
        <path d="M 572 74 V 52 Q 572 44 564 44 H 420 Q 412 44 412 52 V 88" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- QA PASS: to orchestrator -->
        <line x1="636" y1="114" x2="732" y2="114" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- QA FAIL, exception asked: to owner waiver -->
        <line x1="572" y1="154" x2="572" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Waiver NO: back to engineer, underneath -->
        <path d="M 508 252 H 420 Q 412 252 412 244 V 140" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Waiver YES: to orchestrator -->
        <path d="M 636 252 H 676 Q 684 252 684 244 V 140 Q 684 132 692 132 H 732" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Release column -->
        <line x1="824" y1="144" x2="824" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="824" y1="264" x2="824" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="824" y1="356" x2="824" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ===== Arrow labels (opaque masks, 8px gap from the stroke) ===== -->
        <rect x="476" y="24" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="492" y="33" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FAIL</text>

        <rect x="668" y="94" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="684" y="103" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PASS</text>

        <rect x="454" y="177" width="110" height="12" rx="2" fill="#f5f5f5"/>
        <text x="509" y="186" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FAIL: ASK FOR WAIVER</text>

        <rect x="452" y="232" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="464" y="241" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <rect x="604" y="186" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="195" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES, RECORDED</text>

        <rect x="832" y="166" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="858" y="175" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GREEN CI</text>

        <!-- ===== Nodes ===== -->
        <!-- Start: owner picks (owner decision, oval) -->
        <rect x="44" y="90" width="112" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="44" y="90" width="112" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="100" y="111" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Owner picks</text>
        <text x="100" y="126" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the next issue</text>

        <!-- PM -->
        <rect x="188" y="88" width="128" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="252" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PM grooms issue</text>
        <text x="252" y="125" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">acceptance criteria</text>

        <!-- Engineer -->
        <rect x="348" y="88" width="128" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="412" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Engineer builds</text>
        <text x="412" y="125" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tests · commit · PR</text>

        <!-- QA decision -->
        <polygon points="572,74 636,114 572,154 508,114" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="572" y="111" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">QA checks</text>
        <text x="572" y="125" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PR commit</text>

        <!-- Owner waiver decision -->
        <polygon points="572,212 636,252 572,292 508,252" fill="#f5f5f5"/>
        <polygon points="572,212 636,252 572,292 508,252" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="572" y="249" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Waiver</text>
        <text x="572" y="263" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">granted?</text>

        <!-- Orchestrator -->
        <rect x="732" y="84" width="184" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="824" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Orchestrator</text>
        <text x="824" y="126" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reports evidence to owner</text>

        <!-- Owner authorizes merge -->
        <rect x="732" y="200" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="732" y="200" width="184" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="824" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Owner authorizes merge</text>
        <text x="824" y="240" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">to main, issue closes</text>
        <text x="824" y="253" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deploys nothing</text>

        <!-- Owner names prod commit -->
        <rect x="732" y="300" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="732" y="300" width="184" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="824" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Owner names prod commit</text>
        <text x="824" y="340" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">after its CI run is green</text>

        <!-- End: manual prod promote -->
        <rect x="736" y="392" width="176" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="736" y="392" width="176" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="824" y="413" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Manual prod promote</text>
        <text x="824" y="428" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deploys it, checks health</text>

        <!-- ===== Legend (bottom strip, left of the end node) ===== -->
        <line x1="44" y1="404" x2="696" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="44" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="44" y="428" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="76" y="437.5" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Start / end</text>

        <rect x="148" y="428" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="180" y="437.5" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Owner decision (human gate)</text>

        <rect x="332" y="428" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="364" y="437.5" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Agent step</text>

        <polygon points="436,434 448,428 460,434 448,440" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="468" y="437.5" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Decision</text>

        <line x1="532" y1="434" x2="560" y2="434" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="568" y="437.5" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Sent back to engineer</text>
      </svg>
    </div>
  </div>
</body>
</html>
